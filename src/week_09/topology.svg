<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="monospace" font-size="14">
  <defs>
    <marker id="dot8a" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="3" fill="#333" />
    </marker>
  </defs>

  <!-- links: rtr-up1 (top left), rtr-up2 (top right), rtr-org (bottom center) -->
  <line x1="235" y1="150" x2="400" y2="290" stroke="#333" stroke-width="2" marker-start="url(#dot8a)" marker-end="url(#dot8a)" />
  <line x1="645" y1="150" x2="480" y2="290" stroke="#333" stroke-width="2" marker-start="url(#dot8a)" marker-end="url(#dot8a)" />

  <!-- link labels -->
  <text x="130" y="230" fill="#555" font-size="12">2001:db8:8:f1::/127</text>
  <text x="146" y="248" fill="#555" font-size="12">up1: ::  org: ::1</text>
  <text x="146" y="266" fill="#555" font-size="12">(org: eth1)</text>
  <text x="560" y="230" fill="#555" font-size="12">2001:db8:8:f2::/127</text>
  <text x="576" y="248" fill="#555" font-size="12">up2: ::  org: ::1</text>
  <text x="576" y="266" fill="#555" font-size="12">(org: eth2)</text>

  <!-- eBGP session labels -->
  <text x="300" y="205" fill="#1565c0" font-size="12" font-weight="bold" transform="rotate(40 300 205)">eBGP</text>
  <text x="562" y="185" fill="#1565c0" font-size="12" font-weight="bold" transform="rotate(-40 562 185)">eBGP</text>

  <!-- AS 64501 / rtr-up1 (top left) -->
  <rect x="130" y="55" width="210" height="100" rx="10" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="140" y="48" fill="#777" font-size="12">AS 64501</text>
  <rect x="165" y="70" width="140" height="72" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2" />
  <text x="235" y="93" text-anchor="middle" font-weight="bold">rtr-up1</text>
  <text x="235" y="111" text-anchor="middle" font-size="11">rid 10.8.0.2</text>
  <text x="235" y="128" text-anchor="middle" font-size="11">lo 2001:db8:501::1/48</text>

  <!-- AS 64502 / rtr-up2 (top right) -->
  <rect x="540" y="55" width="210" height="100" rx="10" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="550" y="48" fill="#777" font-size="12">AS 64502</text>
  <rect x="575" y="70" width="140" height="72" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2" />
  <text x="645" y="93" text-anchor="middle" font-weight="bold">rtr-up2</text>
  <text x="645" y="111" text-anchor="middle" font-size="11">rid 10.8.0.3</text>
  <text x="645" y="128" text-anchor="middle" font-size="11">lo 2001:db8:502::1/48</text>

  <!-- AS 64500 / rtr-org (bottom center) -->
  <rect x="335" y="275" width="210" height="100" rx="10" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="345" y="393" fill="#777" font-size="12">AS 64500 (the organization)</text>
  <rect x="370" y="290" width="140" height="72" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
  <text x="440" y="313" text-anchor="middle" font-weight="bold">rtr-org</text>
  <text x="440" y="331" text-anchor="middle" font-size="11">rid 10.8.0.1</text>
  <text x="440" y="348" text-anchor="middle" font-size="11">lo 2001:db8:500::1/48</text>

  <text x="440" y="425" text-anchor="middle" font-size="12" fill="#777">
    Three FRR routers, three ASes: the organization peers eBGP with two independent upstreams. Each AS originates its /48 from a loopback.
  </text>
</svg>
