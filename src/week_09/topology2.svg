<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="monospace" font-size="14">
  <defs>
    <marker id="dot9c" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="3" fill="#333" />
    </marker>
  </defs>

  <!-- Part 1 region -->
  <rect x="30" y="30" width="840" height="260" rx="12" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="8 5" />
  <text x="45" y="20" fill="#777" font-size="13">Part 1: already deployed, mentor-operated (not yours to build)</text>

  <!-- isp1 -->
  <line x1="150" y1="45" x2="150" y2="80" stroke="#333" stroke-width="2" />
  <text x="160" y="65" fill="#555" font-size="12">isp1 (public Internet)</text>
  <!-- isp2 -->
  <line x1="750" y1="45" x2="750" y2="80" stroke="#333" stroke-width="2" />
  <text x="620" y="65" fill="#555" font-size="12">isp2 (Internet2)</text>

  <!-- isp1 - rtr1 -->
  <line x1="150" y1="80" x2="150" y2="115" stroke="#333" stroke-width="2" marker-end="url(#dot9c)" />
  <!-- isp2 - rtr2 -->
  <line x1="750" y1="80" x2="750" y2="115" stroke="#333" stroke-width="2" marker-end="url(#dot9c)" />

  <!-- rtr1 -->
  <rect x="80" y="115" width="140" height="65" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2" />
  <text x="150" y="140" text-anchor="middle" font-weight="bold">rtr1</text>
  <text x="150" y="157" text-anchor="middle" font-size="11">AS 64505</text>
  <text x="150" y="172" text-anchor="middle" font-size="10">500+500+default</text>

  <!-- rtr2 -->
  <rect x="680" y="115" width="140" height="65" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2" />
  <text x="750" y="140" text-anchor="middle" font-weight="bold">rtr2</text>
  <text x="750" y="157" text-anchor="middle" font-size="11">AS 64506</text>
  <text x="750" y="172" text-anchor="middle" font-size="10">250+250+default</text>
  <text x="750" y="187" text-anchor="middle" font-size="9" fill="#777">(exact subset of rtr1's)</text>

  <!-- rtr1/rtr2 crossing full mesh down to sw1/sw2 -->
  <!-- rtr1 -> sw1 (direct, red) -->
  <line x1="130" y1="180" x2="130" y2="420" stroke="#c62828" stroke-width="2.5" marker-end="url(#dot9c)" />
  <!-- rtr1 -> sw2 (crossing, red) -->
  <line x1="170" y1="180" x2="760" y2="420" stroke="#c62828" stroke-width="2" marker-end="url(#dot9c)" />
  <!-- rtr2 -> sw2 (direct, blue) -->
  <line x1="770" y1="180" x2="770" y2="420" stroke="#1565c0" stroke-width="2.5" marker-end="url(#dot9c)" />
  <!-- rtr2 -> sw1 (crossing, blue) -->
  <line x1="730" y1="180" x2="140" y2="420" stroke="#1565c0" stroke-width="2" marker-end="url(#dot9c)" />

  <text x="150" y="270" fill="#c62828" font-size="12" font-weight="bold">rtr1: unfiltered</text>
  <text x="150" y="286" fill="#c62828" font-size="11">relay (both switches</text>
  <text x="150" y="301" fill="#c62828" font-size="11">get everything)</text>

  <text x="580" y="270" fill="#1565c0" font-size="12" font-weight="bold">rtr2: unfiltered</text>
  <text x="580" y="286" fill="#1565c0" font-size="11">relay (both switches</text>
  <text x="580" y="301" fill="#1565c0" font-size="11">get everything)</text>

  <!-- Part 2 region -->
  <rect x="30" y="330" width="840" height="270" rx="12" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="8 5" />
  <text x="45" y="320" fill="#777" font-size="13">Part 2: you build this, attaching to br-w9l2-r1 / br-w9l2-r2</text>

  <!-- sw1 -->
  <rect x="60" y="420" width="150" height="70" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
  <text x="135" y="446" text-anchor="middle" font-weight="bold">sw1</text>
  <text x="135" y="463" text-anchor="middle" font-size="11">AS 64500</text>
  <text x="135" y="478" text-anchor="middle" font-size="10">rid 10.9.0.5</text>

  <!-- sw2 -->
  <rect x="690" y="420" width="150" height="70" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
  <text x="765" y="446" text-anchor="middle" font-weight="bold">sw2</text>
  <text x="765" y="463" text-anchor="middle" font-size="11">AS 64500</text>
  <text x="765" y="478" text-anchor="middle" font-size="10">rid 10.9.0.6</text>

  <!-- MCLAG peer link -->
  <line x1="210" y1="470" x2="690" y2="470" stroke="#333" stroke-width="3" />
  <line x1="210" y1="478" x2="690" y2="478" stroke="#333" stroke-width="3" />
  <text x="450" y="500" text-anchor="middle" fill="#555" font-size="12">MCLAG peer link (addressed; real MCLAG control plane out of scope)</text>

  <text x="450" y="545" text-anchor="middle" fill="#777" font-size="12">
    Without policy: both switches see rtr2's 250 prefixes twice (also via rtr1) and two competing default routes.
  </text>
  <text x="450" y="565" text-anchor="middle" fill="#777" font-size="12">
    After policy: default only from rtr1, Internet2 specifics only from rtr2. Neither switch ever needs to transit the other.
  </text>
</svg>
