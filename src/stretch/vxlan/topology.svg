<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="monospace" font-size="14">
  <defs>
    <marker id="dot7" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="3" fill="#333" />
    </marker>
  </defs>

  <!-- overlay tunnel arc -->
  <path d="M 190 130 Q 450 20 710 130" fill="none" stroke="#6a1b9a" stroke-width="2" stroke-dasharray="6,5" />
  <text x="450" y="45" text-anchor="middle" fill="#6a1b9a" font-weight="bold">VNI 100 (overlay tunnel)</text>

  <!-- underlay links -->
  <line x1="190" y1="180" x2="330" y2="180" stroke="#333" stroke-width="2" marker-start="url(#dot7)" marker-end="url(#dot7)" />
  <line x1="430" y1="180" x2="570" y2="180" stroke="#333" stroke-width="2" marker-start="url(#dot7)" marker-end="url(#dot7)" />
  <line x1="670" y1="180" x2="710" y2="180" stroke="#333" stroke-width="2" marker-start="url(#dot7)" marker-end="url(#dot7)" />
  <line x1="90" y1="180" x2="90" y2="220" stroke="#333" stroke-width="0" />

  <!-- access links -->
  <line x1="90" y1="180" x2="190" y2="180" stroke="#333" stroke-width="2" marker-start="url(#dot7)" marker-end="url(#dot7)" />
  <text x="100" y="168" fill="#555" font-size="12">172.16.100.0/24</text>

  <text x="220" y="168" fill="#555" font-size="12">10.7.0.0/30</text>
  <text x="460" y="168" fill="#555" font-size="12">underlay (core)</text>
  <text x="600" y="168" fill="#555" font-size="12">10.7.0.4/30</text>
  <text x="720" y="168" fill="#555" font-size="12">172.16.100.0/24</text>

  <!-- host1 -->
  <rect x="20" y="160" width="90" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
  <text x="65" y="185" text-anchor="middle" font-weight="bold">host1</text>
  <text x="65" y="203" text-anchor="middle" font-size="11">.10/24</text>

  <!-- vtep1 -->
  <rect x="190" y="150" width="140" height="80" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2" />
  <text x="260" y="175" text-anchor="middle" font-weight="bold">vtep1</text>
  <text x="260" y="193" text-anchor="middle" font-size="11">lo 10.7.255.1/32</text>
  <text x="260" y="208" text-anchor="middle" font-size="11">br0 + vxlan100</text>

  <!-- core -->
  <rect x="400" y="160" width="100" height="60" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" />
  <text x="450" y="185" text-anchor="middle" font-weight="bold">core</text>
  <text x="450" y="203" text-anchor="middle" font-size="11">underlay router</text>

  <!-- vtep2 -->
  <rect x="570" y="150" width="140" height="80" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="2" />
  <text x="640" y="175" text-anchor="middle" font-weight="bold">vtep2</text>
  <text x="640" y="193" text-anchor="middle" font-size="11">lo 10.7.255.2/32</text>
  <text x="640" y="208" text-anchor="middle" font-size="11">br0 + vxlan100</text>

  <!-- host2 -->
  <rect x="790" y="160" width="90" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" />
  <text x="835" y="185" text-anchor="middle" font-weight="bold">host2</text>
  <text x="835" y="203" text-anchor="middle" font-size="11">.20/24</text>

  <line x1="710" y1="180" x2="790" y2="180" stroke="#333" stroke-width="2" marker-start="url(#dot7)" marker-end="url(#dot7)" />

  <text x="450" y="280" text-anchor="middle" font-size="12" fill="#777">
    host1 and host2 share one L2 broadcast domain (VNI 100) despite being routed, at L3, through core
  </text>
</svg>
